name = "trip-planner"
main = "worker/index.js"
compatibility_date = "2024-09-23"
account_id = "40d01e30483f118dd25ce563b09cda3d"

# El Worker corre PRIMERO para toda petición (incluidas las de archivos
# estáticos); dentro de worker/index.js, todo lo que no sea /api/* se
# reenvía al binding ASSETS. Es el approach más predecible para mezclar
# API + frontend en un solo Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "trip-planner-db"
database_id = "ad0c8301-ff3f-4cf4-92a7-a7471f4f67ee"